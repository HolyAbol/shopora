services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profiledb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 10.50.0.0/24
          gateway: 10.50.0.1

volumes:
  postgres-data:
